<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Basto admin sign in">
    <title>Basto Admin Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styless.css">
</head>
<body class="admin-page admin-login-page">
    <main class="admin-login-shell">
        <section class="admin-login-panel" aria-labelledby="login-title">
            <p class="eyebrow">BASTO / private access</p>
            <h1 id="login-title">Welcome back.</h1>
            <p class="admin-login-copy">Sign in to manage products, availability, and sold-out items.</p>
            <form class="admin-form" id="admin-login-form">
                <label for="admin-username">Username<input id="admin-username" autocomplete="username" required type="text"></label>
                <label for="admin-password">Password<input id="admin-password" autocomplete="current-password" required type="password"></label>
                <button class="admin-primary" type="submit">Sign in <span aria-hidden="true">-></span></button>
                <p class="admin-login-error" id="login-error" role="alert"></p>
            </form>
            <a class="admin-link" href="index.html">Back to storefront <span aria-hidden="true">-></span></a>
        </section>
    </main>
    <script src="admin-login.js"></script>
</body>
</html>
