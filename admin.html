<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Basto inventory administration">
    <title>Basto Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styless.css">
</head>
<body class="admin-page">
    <main class="admin-shell">
        <header class="admin-header">
            <div>
                <p class="eyebrow">BASTO / store desk</p>
                <h1>Orders and inventory.</h1>
                <p>Keep customer orders moving, then update products as stock changes.</p>
            </div>
            <div class="admin-header-actions"><a class="admin-link" href="index.html">View storefront <span aria-hidden="true">-></span></a><button class="admin-link admin-logout" id="admin-logout" type="button">Log out</button></div>
        </header>

        <section class="admin-panel orders-panel" aria-labelledby="orders-title">
            <div class="orders-heading">
                <div><p class="eyebrow">Customer requests</p><h2 id="orders-title">Orders</h2></div>
                <button class="admin-secondary" id="refresh-orders" type="button">Refresh</button>
            </div>
            <div class="order-tools">
                <label class="sr-only" for="order-search">Search orders</label>
                <input id="order-search" type="search" placeholder="Search name, phone, reference or item">
                <label class="sr-only" for="order-status-filter">Filter by status</label>
                <select id="order-status-filter">
                    <option value="all">All statuses</option>
                    <option>New</option><option>Confirmed</option><option>Paid</option><option>Shipped</option><option>Completed</option><option>Cancelled</option>
                </select>
            </div>
            <p class="admin-status" id="orders-status" role="status"></p>
            <div class="admin-list orders-list" id="orders-list" aria-live="polite"></div>
        </section>

        <div class="admin-layout">
            <section class="admin-panel" aria-labelledby="product-form-title">
                <h2 id="product-form-title">Add an item</h2>
                <form class="admin-form" id="product-form">
                    <input type="hidden" id="product-id">
                    <input id="product-image" type="hidden">
                    <label for="product-image-file">Item image from your computer<input id="product-image-file" accept="image/*" required type="file"></label>
                    <label for="product-name">Item name<input id="product-name" required type="text" placeholder="e.g. Linen resort shirt"></label>
                    <label for="product-category">Category<select id="product-category" required>
                        <option value="tops">Tops</option>
                        <option value="pants">Pants</option>
                        <option value="shoes">Shoes</option>
                        <option value="watch-accessories">Watch &amp; accessories</option>
                        <option value="cap">Cap</option>
                        <option value="cosmetics">Cosmetics</option>
                        <option value="undies">Undies</option>
                    </select></label>
                    <label for="product-description">Description<textarea id="product-description" required placeholder="Short product description"></textarea></label>
                    <label id="size-field">Sizes available
                        <span class="admin-checks" id="size-options"></span>
                    </label>
                    <label for="product-colors">Color available<input id="product-colors" required type="text" placeholder="e.g. Black, sand"></label>
                    <label for="product-price">Price in naira (₦)<input id="product-price" required min="0" step="1" type="number" placeholder="25000"></label>
                    <label for="product-stock">Total pieces<input id="product-stock" required min="0" step="1" type="number" value="1" placeholder="5"></label>
                    <label for="product-sold">Pieces sold<input id="product-sold" required min="0" step="1" type="number" value="0" placeholder="2"></label>
                    <label class="availability-toggle"><input id="product-available" checked type="checkbox"> Available for purchase</label>
                    <div class="admin-actions">
                        <button class="admin-primary" id="save-product" type="submit">Add item</button>
                        <button class="admin-secondary" id="cancel-edit" type="button" hidden>Cancel edit</button>
                    </div>
                    <p class="admin-status" id="form-status" role="status"></p>
                </form>
            </section>

            <section class="admin-panel" aria-labelledby="inventory-title">
                <h2 id="inventory-title">Your inventory</h2>
                <div class="admin-list" id="inventory-list"></div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="admin.js"></script>
</body>
</html>
